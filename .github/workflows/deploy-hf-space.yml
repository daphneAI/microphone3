name: Verify and Deploy to Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run lint (compile check)
        run: |
          python -m py_compile $(git ls-files "**/*.py") || true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Hugging Face Space
        env:
          space3Devices: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${space3Devices}" ]; then echo "space3Devices secret missing"; exit 1; fi
          SPACE_USER=daphneAI
          SPACE_NAME=space3Devices
          # push to Space using token auth in URL
          git remote add hf "https://huggingface.co/spaces/$SPACE_USER/$SPACE_NAME" || true
          git push "https://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@huggingface.co/spaces/daphneAI/space3Devices" HEAD:main --force
