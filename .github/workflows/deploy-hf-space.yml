name: Verify and Deploy to Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run lint (compile check)
        run: |
          python -m py_compile $(git ls-files "**/*.py") || true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then echo "HF_TOKEN secret missing"; exit 1; fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # squash to a single commit so old binary blobs in history are never pushed to the Space
          git checkout --orphan space-deploy
          git add -A
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add space "https://daphneAI:${HF_TOKEN}@huggingface.co/spaces/daphneAI/space3Devices" || true
          git push --force space space-deploy:main
