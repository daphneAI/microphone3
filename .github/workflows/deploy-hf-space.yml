name: Verify and Deploy to Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run lint (compile check)
        run: |
          python -m py_compile $(git ls-files "**/*.py") || true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then echo "HF_TOKEN secret missing"; exit 1; fi
          SPACE_USER=daphneAI
          SPACE_NAME=space3Devices
          git fetch --unshallow origin || git fetch --all --tags || true
          git remote add space "https://daphneAI:${HF_TOKEN}@huggingface.co/spaces/$SPACE_USER/$SPACE_NAME" || true
          git push --force space HEAD:main

